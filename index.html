<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PA2 – Virich Surface</title>
<style>
    body {
        margin: 0;
        background: #2b2b2b;
        font-family: Arial, Helvetica, sans-serif;
        color: #eee;
    }

    h3 {
        margin: 10px 20px;
        font-weight: normal;
        text-align: center;
    }

    .top-panel {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 10px 20px;
        background: #3a3a3a;
        border-bottom: 1px solid #555;
    }

    .sliders {
        font-size: 14px;
    }

    .sliders label {
        display: block;
        margin-bottom: 8px;
    }

    .sliders input[type="range"] {
        width: 160px;
        vertical-align: middle;
    }

    .panel {
        background: rgba(0, 0, 0, 0.6);
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 13px;
        line-height: 1.5;
        min-width: 260px;
    }

    .panel-title {
        font-weight: bold;
        margin-bottom: 6px;
        color: #9aff9a;
    }

    .panel .values {
        margin-bottom: 8px;
    }

    .panel .controls {
        color: #cccccc;
        font-size: 12px;
    }

    canvas {
        display: block;
        margin: 0 auto;
        background: black;
    }
</style>


    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./model.js"></script>
    <script src="./main.js"></script>
</head>

<body onload="init()">

<h3>Virich Cyclic Surface</h3>

<div class="top-panel">

    <div class="sliders">
        <label>
            U Steps:
            <input type="range" id="uSlider" min="10" max="100" value="50">
            <span id="uVal">50</span>
        </label>

        <label>
            V Steps:
            <input type="range" id="vSlider" min="10" max="100" value="50">
            <span id="vVal">50</span>
        </label>
    </div>

    <div class="panel">
        <div class="panel-title">Texture Controls</div>

        <div class="values">
            Pivot U: <span id="val-u">0.50</span><br>
            Pivot V: <span id="val-v">0.50</span><br>
            Scale: <span id="val-scale">1.00</span><br>
            Angle: <span id="val-angle">0</span>°
        </div>

        <div class="controls">
            W / S – move pivot V<br>
            A / D – move pivot U<br>
            Q / E – scale texture<br>
            Z / X – rotate texture<br>
            R – reset
        </div>
    </div>

</div>

<canvas id="webglcanvas" width="700" height="700"></canvas>


</body>
</html>
